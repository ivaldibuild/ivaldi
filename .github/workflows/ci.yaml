name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # A release tag publishes a release-numbered agent image and chart.
    tags:
      - 'v*'
  merge_group:
  workflow_dispatch:

concurrency:
  # Pushes are grouped by commit, never by branch: a queued run replaced by a
  # newer push would leave its changes untested, because the next run's path
  # filter only compares against the push before it.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The toolchain is pinned by mise, so never let Go download another one.
  GOTOOLCHAIN: local
  # The postinstall hook runs `corepack use`, which writes a root package.json
  # when there is none. Enable pnpm explicitly in the jobs that need it.
  MISE_NO_HOOKS: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  changes:
    name: Detect changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      webui: ${{ steps.filter.outputs.webui }}
      charts: ${{ steps.filter.outputs.charts }}
    steps:
      # Only pushes need the repository: paths-filter compares their commits,
      # which needs history. Pull requests go through the API.
      - name: Checkout repository
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A tag push has no meaningful diff, so its outputs stay empty and
      # every job runs.
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Every filter lists this workflow, so a change to CI runs all of it.
          filters: |
            go:
              - '.github/workflows/ci.yaml'
              - '.dockerignore'
              - 'apps/cli/**'
              - 'apps/control-plane/**'
              - 'apps/k8s-agent/**'
              - 'pkg/**'
              - 'go.work'
              - 'go.work.sum'
              - 'mise.toml'
              - 'Makefile'
              - 'scripts/version.sh'
            webui:
              - '.github/workflows/ci.yaml'
              - 'apps/webui/**'
              - 'api/openapi.json'
              # The cluster guide's values are checked against the chart's schema.
              - 'deploy/helm/ivaldi-agent/values.schema.json'
              - 'mise.toml'
            charts:
              - '.github/workflows/ci.yaml'
              - 'deploy/helm/**'
              # It sets the version the chart is published with.
              - 'scripts/version.sh'

  go-test:
    name: Test ${{ matrix.module }}
    needs: changes
    # An empty output means the event has no changed-paths filter (merge queue,
    # manual run), so every job runs there.
    if: needs.changes.outputs.go != 'false'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: pkg
            packages: ./pkg/...
            services: true
          - module: control-plane
            packages: ./apps/control-plane/...
            services: true
          - module: cli
            packages: ./apps/cli/...
            services: false
          - module: k8s-agent
            packages: ./apps/k8s-agent/...
            services: false
    services:
      # A service whose image is empty does not start.
      postgres:
        image: ${{ matrix.services && 'postgres:17.5-alpine3.22' || '' }}
        env:
          POSTGRES_USER: ivaldi
          POSTGRES_PASSWORD: ivaldi
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ivaldi -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: ${{ matrix.services && 'valkey/valkey:8.1-alpine3.22' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Repository tests use these and skip when they are unset.
      IVALDI_TEST_DATABASE_URL: ${{ matrix.services && 'postgres://ivaldi:ivaldi@localhost:5432/postgres?sslmode=disable' || '' }}
      IVALDI_TEST_REDIS_URL: ${{ matrix.services && 'redis://localhost:6379/0' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true
      # Each job keeps its own cache: they build different packages, and jobs
      # sharing one key race to save it with only their own build output.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-test-${{ matrix.module }}-${{ hashFiles('**/go.mod', '**/go.sum', 'go.work', 'go.work.sum') }}
          restore-keys: |
            go-${{ runner.os }}-test-${{ matrix.module }}-
      - name: Test ${{ matrix.module }}
        run: go test -race -count=1 -timeout 20m ${{ matrix.packages }}

  go-check:
    name: Format and vet
    needs: changes
    if: needs.changes.outputs.go != 'false'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-check-${{ hashFiles('**/go.mod', '**/go.sum', 'go.work', 'go.work.sum') }}
          restore-keys: |
            go-${{ runner.os }}-check-
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l apps pkg)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./pkg/... ./apps/cli/... ./apps/control-plane/... ./apps/k8s-agent/...

  build:
    name: Build binaries
    needs: changes
    if: needs.changes.outputs.go != 'false'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Makefile stamps binaries with `git describe`, which needs tags.
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-build-${{ hashFiles('**/go.mod', '**/go.sum', 'go.work', 'go.work.sum') }}
          restore-keys: |
            go-${{ runner.os }}-build-
      - name: Build
        run: make build

  migrations:
    name: Migrations
    needs: changes
    if: needs.changes.outputs.go != 'false'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.5-alpine3.22
        env:
          POSTGRES_USER: ivaldi
          POSTGRES_PASSWORD: ivaldi
          POSTGRES_DB: ivaldi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ivaldi -d ivaldi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ivaldi:ivaldi@localhost:5432/ivaldi?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true
      # The tests apply migrations through databasetest; this checks the path
      # deployments use: the migrate CLI with each capability's version table.
      - name: Apply every migration
        run: make migrate_up
      # Every capability with migrations is rolled back by name, so one missing
      # from the Makefile's CAPABILITIES fails here instead of never migrating.
      - name: Roll every migration back
        run: |
          for dir in apps/control-plane/internal/*/migrations; do
            count=$(find "$dir" -name '*.up.sql' | wc -l)
            [ "$count" -gt 0 ] || continue
            make --no-print-directory migrate_down capability="$(basename "$(dirname "$dir")")" steps="$count"
          done
      - name: Apply every migration again
        run: make migrate_up

  webui:
    name: Web UI
    needs: changes
    if: needs.changes.outputs.webui != 'false'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true
      - name: Enable pnpm
        run: corepack enable
      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-${{ hashFiles('apps/webui/pnpm-lock.yaml', 'apps/webui/package.json') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Install dependencies
        working-directory: apps/webui
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: apps/webui
        run: pnpm run build
      - name: Test
        working-directory: apps/webui
        run: pnpm exec ng test --watch=false

  generated:
    name: OpenAPI and generated clients
    needs: changes
    if: needs.changes.outputs.go != 'false' || needs.changes.outputs.webui != 'false'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true
      - name: Enable pnpm
        run: corepack enable
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-generated-${{ hashFiles('**/go.mod', '**/go.sum', 'go.work', 'go.work.sum') }}
          restore-keys: |
            go-${{ runner.os }}-generated-
      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-${{ hashFiles('apps/webui/pnpm-lock.yaml', 'apps/webui/package.json') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Install dependencies
        working-directory: apps/webui
        run: pnpm install --frozen-lockfile
      - name: Check committed generated files are current
        run: make openapi_check

  images:
    name: Image ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.go != 'false' || needs.changes.outputs.webui != 'false' || needs.changes.outputs.charts != 'false'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
      # Pushes to ghcr.io. Pull requests from forks get a read-only token
      # whatever this says, which is fine: pull requests never push.
      packages: write
    env:
      # Only pushes to main and release tags publish images; pull requests and
      # the merge queue build them to check the Dockerfiles.
      PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ivaldi
            context: .
            file: apps/control-plane/Dockerfile
            changed: ${{ needs.changes.outputs.go }}
          - image: ivaldi-webui
            context: apps/webui
            file: apps/webui/Dockerfile
            changed: ${{ needs.changes.outputs.webui }}
          # Built when the chart changes too: each chart version names the
          # image of the same version, so the chart is never published
          # without it (see publish-chart).
          - image: ivaldi-k8s-agent
            context: .
            file: apps/k8s-agent/Dockerfile
            changed: ${{ (needs.changes.outputs.go == 'false' && needs.changes.outputs.charts == 'false') && 'false' || 'true' }}
    steps:
      # A job's `if` cannot see the matrix, so a leg whose paths did not change
      # skips its steps instead.
      - name: Checkout repository
        if: matrix.changed != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version stamped into ivaldi comes from `git describe`, as `make
          # build` does, which needs tags.
          fetch-depth: 0
      # One version for the control plane, the agent, its image, and its
      # chart. An image tag cannot hold SemVer build metadata's "+", so the
      # tag has "_" in its place, which the agent chart renders the same way.
      - name: Describe version
        id: version
        if: matrix.changed != 'false'
        run: |
          version=$(scripts/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${version//+/_}" >> "$GITHUB_OUTPUT"
      # Tags each image with the full commit SHA, and with `main` on main. The
      # labels include org.opencontainers.image.source, which links the ghcr.io
      # package to this repository so it inherits the repository's access.
      - name: Image tags and labels
        id: meta
        if: matrix.changed != 'false'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Log in to ghcr.io
        if: matrix.changed != 'false' && env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Blacksmith's builder keeps layers and RUN --mount=type=cache contents
      # (the Go module and build caches) on a sticky disk per cache key, so no
      # cache-from or cache-to is needed. One key per Dockerfile keeps the two
      # images from evicting each other's layers.
      - name: Set up Blacksmith Docker builder
        if: matrix.changed != 'false'
        uses: useblacksmith/setup-docker-builder@06dd9c83a5d541274d2e3ac67625560979275267 # v2.3.0
        with:
          cache-key: ${{ matrix.file }}
      - name: Build ${{ matrix.image }}
        if: matrix.changed != 'false'
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Go images take a VERSION; the web UI's does not.
          build-args: ${{ matrix.image != 'ivaldi-webui' && format('VERSION={0}', steps.version.outputs.version) || '' }}

  charts:
    name: Helm charts
    needs: changes
    if: needs.changes.outputs.charts != 'false'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - name: Lint charts
        run: |
          helm lint --strict deploy/helm/ivaldi
          # The agent chart requires the control plane's URL.
          helm lint --strict deploy/helm/ivaldi-agent --set controlPlane.url=https://ivaldi.example.com

  # The agent against a kind cluster and a real control plane: connect the
  # cluster with the agent chart, deploy a Release, a second, and the first
  # again (apps/k8s-agent/e2e).
  k8s-agent-e2e:
    name: Kubernetes agent e2e
    needs: changes
    if: needs.changes.outputs.go != 'false' || needs.changes.outputs.charts != 'false'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The images are stamped with scripts/version.sh, which needs tags.
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-e2e-${{ hashFiles('**/go.mod', '**/go.sum', 'go.work', 'go.work.sum') }}
          restore-keys: |
            go-${{ runner.os }}-e2e-
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - name: Install kind
        run: |
          GOWORK=off GOBIN="$HOME/.local/bin" go install sigs.k8s.io/kind@v0.33.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Vet the e2e test
        run: go vet -tags e2e ./apps/k8s-agent/e2e/
      - name: Run the e2e
        run: make k8s_agent_e2e

  # Publishes the agent chart to ghcr.io as an OCI artifact, with the same
  # version as the agent image published by the images job in this run.
  publish-chart:
    name: Publish agent chart
    needs: [changes, images, charts]
    # !cancelled() overrides the implicit success(), which would skip this
    # job whenever charts is skipped, as on a push that changes only Go.
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      && needs.images.result == 'success'
      && needs.charts.result != 'failure'
      && (needs.changes.outputs.go != 'false' || needs.changes.outputs.charts != 'false')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Describe version
        id: version
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Package and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          # Chart versions are immutable: refuse to overwrite one.
          if helm show chart "$REPOSITORY/ivaldi-agent" --version "$VERSION" >/dev/null 2>&1; then
            echo "::error::ivaldi-agent $VERSION is already published"
            exit 1
          fi
          helm package deploy/helm/ivaldi-agent --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/ivaldi-agent-$VERSION.tgz" "$REPOSITORY"

  # The one check branch protection should require. Which jobs run depends on
  # the paths a change touches, and GitHub counts a skipped required check as
  # passing, including one skipped because a job it needs failed.
  ci-ok:
    name: CI
    if: always()
    needs: [changes, go-test, go-check, build, migrations, webui, generated, images, charts, k8s-agent-e2e, publish-chart]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A required job failed or was cancelled."
          exit 1
