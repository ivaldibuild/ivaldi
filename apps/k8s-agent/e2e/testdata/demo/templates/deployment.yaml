apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  annotations:
    e2e.ivaldi.build/environment: {{ .Values.environment | quote }}
    e2e.ivaldi.build/greeting: {{ .Values.greeting | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo
    spec:
      containers:
        - name: app
          image: {{ required "global.ivaldi.artifacts.app is required" .Values.global.ivaldi.artifacts.app.image | quote }}
          {{- /* The Secret the agent writes for this Deployment's secret variables. */}}
          {{- with dig "secrets" "name" "" .Values.global.ivaldi }}
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: Api.Token
          {{- end }}
