server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # The startup script can change index.html on every start, so browsers
    # revalidate it instead of caching it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built files carry a content hash in their names and never change.
    location ~ "-[A-Z0-9]{8}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a route of the single-page app.
    location / {
        try_files $uri /index.html;
    }
}
