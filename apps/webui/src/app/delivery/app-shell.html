<div hlmSidebarWrapper class="bg-background text-foreground">
  <hlm-sidebar
    collapsible="icon"
    srOnlySheetTitle="Navigation"
    srOnlySheetDescription="Where to go in Ivaldi."
  >
    <div hlmSidebarHeader class="gap-4 pt-4">
      <div class="px-1 group-data-[collapsible=icon]:px-0"><app-organisation-badge /></div>
      <div class="flex flex-col gap-1.5 px-1 group-data-[collapsible=icon]:hidden">
        <label for="workspace-switcher" class="text-muted-foreground text-xs">Workspace</label>
        <select
          id="workspace-switcher"
          class="border-input bg-background text-foreground h-9 border px-2 text-sm"
          (change)="selectWorkspace($event)"
        >
          @for (workspace of context.workspaces(); track workspace.id) {
            <option [value]="workspace.id" [selected]="workspace.id === context.current()?.id">
              {{ workspace.display_name }}
            </option>
          }
        </select>
      </div>
    </div>

    <nav hlmSidebarContent aria-label="Primary">
      @for (group of groups; track group.label) {
        <div hlmSidebarGroup>
          <div
            hlmSidebarGroupLabel
            class="text-muted-foreground text-[11px] font-semibold tracking-[0.24em] uppercase"
          >
            {{ group.label }}
          </div>
          <ul hlmSidebarMenu>
            @for (item of group.items; track item.path) {
              <li hlmSidebarMenuItem>
                <a
                  hlmSidebarMenuButton
                  class="data-[active=true]:text-heading data-[active=true]:[&_ng-icon]:text-primary-text no-underline"
                  closeMobileSidebarOnClick
                  [routerLink]="item.path"
                  [isActive]="isActive(item)"
                  [tooltip]="item.label"
                  [attr.aria-current]="isActive(item) ? 'page' : null"
                >
                  <ng-icon [name]="item.icon" aria-hidden="true" />
                  <span>{{ item.label }}</span>
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </nav>

    <div hlmSidebarFooter class="border-sidebar-border border-t">
      <ul hlmSidebarMenu>
        <li hlmSidebarMenuItem class="px-1 py-1 group-data-[collapsible=icon]:px-0">
          <app-user-badge />
        </li>
        <li hlmSidebarMenuItem>
          <button hlmSidebarMenuButton type="button" tooltip="Sign out" (click)="signOut()">
            <ng-icon name="lucideLogOut" aria-hidden="true" />
            <span>Sign out</span>
          </button>
        </li>
      </ul>
    </div>

    <button hlmSidebarRail aria-label="Collapse or expand the sidebar"></button>
  </hlm-sidebar>

  <main hlmSidebarInset class="min-w-0">
    <div class="flex h-12 items-center px-2 md:px-4">
      <button hlmSidebarTrigger srOnlyText="Collapse or expand the sidebar"></button>
    </div>
    <div class="px-4 pb-8 md:px-12">
      <router-outlet />
    </div>
  </main>
</div>
