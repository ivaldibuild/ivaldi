# Local development. `make local`, `make local_serve`, and `make local_stack`
# copy this file to config.local.yml when that file is missing; edit the copy,
# which git ignores. Environment variables override it.
#
# `make local` starts PostgreSQL and Valkey and applies the migrations, and
# `make local_serve` runs the control plane on your machine with this file.
# `make local_stack` runs the control plane in a container with the same file,
# overriding only the database and Valkey addresses. The control plane serves
# the web app too, on http://localhost:8660.
#
# Paths are relative to the repository root. `make local_secrets` generates the
# files in .local/.
deployment_mode: self-hosted
external_url: http://localhost:8660

logging:
  level: debug
  format: text

persistence:
  database_url: postgres://ivaldi_db_user:brokandsindri@127.0.0.1:5433/ivaldi?sslmode=disable

redis:
  address: 127.0.0.1:6379
  password_file: .local/valkey-password

# Runtime agents. The control plane tells an enrolled agent these intervals
# through GET /v1/agent/targets, so the agent has no interval flags of its own.
# One silent for three heartbeat intervals is treated as offline.
runners:
  heartbeat_interval: 30s
  agent_poll_interval: 5s
  agent_watch_interval: 60s
  # The chart the onboarding guide installs. Leave the version empty to use
  # this control plane's version; a mirror overrides the chart reference.
  agent_chart: oci://ghcr.io/ivaldibuild/charts/ivaldi-agent
  agent_chart_version: ""

# Platform workloads (ADR 0015) are components that serve every
# Organization, such as the gateway. The control plane creates, updates, and
# suspends them to match this list on every start. `make local_secrets`
# generates the gateway's key pair; uncomment this with the gateway section.
# platform:
#   workloads:
#     - name: gateway
#       component: gateway
#       public_key_files: [.local/gateway-key.pub]

# The integration gateway. Only the gateway reads this section; it calls the
# control plane as the platform workload above, signing with its private
# key. The top level is shared by the gateway's modules; each module
# (webhooks, later MCP) has its own section, and a disabled module needs
# none of its settings. Uncomment this section and run `make local_gateway`
# (or `ivaldi gateway --config config.local.yml`) to receive GitHub webhooks
# locally. The GitHub App's webhook secret must be the value in
# .local/github-webhook-secret.
# gateway:
#   host: 127.0.0.1
#   port: 8663
#   control_plane_url: http://localhost:8660
#   log_file_prefix: ivaldi-gateway
#   identity:
#     private_key_file: .local/gateway-key.pem
#   webhooks:
#     enabled: true
#     route_cache_ttl: 5m
#     max_body_bytes: 26214400
#     request_timeout: 30s
#     github:
#       secret_file: .local/github-webhook-secret
#       path: /webhooks/github

# The relay publishes the control plane's domain events to this stream. It is
# separate from the gateway's events stream.
# outbox:
#   stream: ivaldi:control-plane:events

# Notifications read the outbox stream with their own consumer group and tell
# people about approval requests that wait for them.
# notifications:
#   consumer_group: notifications
#   concurrency: 10
#   dead_letter_stream: ivaldi:control-plane:events:notifications:dead
#   # Email each notification too (docs/self-hosting/notifications.md). Off
#   # while smtp_address is empty. For a local catcher such as Mailpit:
#   email:
#     smtp_address: localhost:1025
#     from: Ivaldi <ivaldi@localhost>
#     tls: none   # only allowed for a server on this host
#     # username: ivaldi
#     # password_file: .local/smtp-password

auth:
  login_url: http://localhost:8660/login
  signing_key_files: [.local/signing.pem]
  builtin_accounts: true
  web_client:
    # 8660 is the control plane, which serves the web app. 8670 is `ng serve`,
    # the web app's live-reload development server, which proxies to the API.
    redirect_uris: [http://localhost:8660/auth/callback, http://localhost:8670/auth/callback]
  # Sign-in providers. Register the callback
  # http://localhost:8660/auth/oauth/<provider>/callback with the provider,
  # and put the client secret in .local/. See docs/self-hosting/sign-in.md.
  # providers:
  #   github:
  #     client_id: <client ID>
  #     client_secret_file: .local/github-client-secret
  #     allowed_organizations: [<your GitHub organization>]

# Used only when the database is empty. To bootstrap again, run `make local_reset`.
bootstrap:
  organization_name: Ivaldi Local
  admin_email: admin@ivaldi.local
  admin_password_file: .local/admin-password

# GitHub, through a GitHub App (docs/self-hosting/version-control.md).
# Organizations connect GitHub accounts by installing the App; GitHub confirms
# the person installing can access the installation before Ivaldi records it.
# The private key and client secret stay in files.
version_control:
  github:
    app_id: <GitHub App ID>
    slug: <the App's URL name>
    client_id: <the App's client ID>
    client_secret_file: .local/github-client-secret
    private_key_file: .local/github-app.pem
    # web_url: https://ghe.example.com   # GitHub Enterprise Server only
