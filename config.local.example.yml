# Local development. `make local`, `make local_serve`, and `make local_stack`
# copy this file to config.local.yml when that file is missing; edit the copy,
# which git ignores. Environment variables override it.
#
# `make local` starts PostgreSQL and Valkey and applies the migrations, and
# `make local_serve` runs the control plane on your machine with this file.
# `make local_stack` runs the control plane in a container with the same file,
# overriding only the database and Valkey addresses, and serves the web app
# on http://localhost:8670.
#
# Paths are relative to the repository root. `make local_secrets` generates the
# files in .local/.
deployment_mode: self-hosted
external_url: http://localhost:8660
# The web app, which renders sign-in and calls the API from the browser.
allowed_origins: [http://localhost:8670]

logging:
  level: debug
  format: text

persistence:
  database_url: postgres://ivaldi_db_user:brokandsindri@127.0.0.1:5433/ivaldi?sslmode=disable

redis:
  address: 127.0.0.1:6379
  password_file: .local/valkey-password

# The integration gateway. The control plane reads only
# gateway.webhook_route_lookup_token_file; the gateway reads the rest, so both
# commands can use this file. Uncomment this section and run
# `make local_gateway` (or `ivaldi gateway --config config.local.yml`) to
# receive GitHub webhooks locally. The GitHub App's webhook secret must be the
# value in .local/github-webhook-secret.
# gateway:
#   host: 127.0.0.1
#   port: 8663
#   control_plane_url: http://localhost:8660
#   webhook_route_lookup_token_file: .local/gateway-lookup-token
#   route_cache_ttl: 5m
#   max_body_bytes: 26214400
#   log_file_prefix: ivaldi-gateway
#   github:
#     webhook_secret_file: .local/github-webhook-secret
#     path: /webhooks/github

# The relay publishes the control plane's domain events to this stream. It is
# separate from the gateway's events stream.
# outbox:
#   stream: ivaldi:control-plane:events

auth:
  login_url: http://localhost:8670/login
  signing_key_files: [.local/signing.pem]
  builtin_accounts: true
  web_client:
    redirect_uris: [http://localhost:8670/auth/callback]
  # Sign-in providers. Register the callback
  # http://localhost:8660/auth/oauth/<provider>/callback with the provider,
  # and put the client secret in .local/. See docs/self-hosting/sign-in.md.
  # providers:
  #   github:
  #     client_id: <client ID>
  #     client_secret_file: .local/github-client-secret
  #     allowed_organizations: [<your GitHub organization>]

# Used only when the database is empty. To bootstrap again, run `make local_reset`.
bootstrap:
  organization_name: Ivaldi Local
  admin_email: admin@ivaldi.local
  admin_password_file: .local/admin-password

# GitHub, through a GitHub App (docs/self-hosting/version-control.md).
# Organizations connect GitHub accounts by installing the App; GitHub confirms
# the person installing can access the installation before Ivaldi records it.
# The private key and client secret stay in files.
version_control:
  github:
    app_id: <GitHub App ID>
    slug: <the App's URL name>
    client_id: <the App's client ID>
    client_secret_file: .local/github-client-secret
    private_key_file: .local/github-app.pem
    # web_url: https://ghe.example.com   # GitHub Enterprise Server only
