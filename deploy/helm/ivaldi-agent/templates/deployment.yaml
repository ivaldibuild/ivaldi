apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ivaldi-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ivaldi-agent.labels" . | nindent 4 }}
spec:
  # One active agent per cluster: Recreate here, and a Lease in the agent.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ivaldi-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ivaldi-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ivaldi-agent.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          {{- /* An image tag cannot hold SemVer build metadata's "+"; CI tags
               the image with "_" in its place, as Helm does in labels. */}}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (.Chart.AppVersion | replace "+" "_") }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: IVALDI_SERVER_URL
              value: {{ required "controlPlane.url is required" .Values.controlPlane.url | quote }}
            {{- if .Values.controlPlane.allowInsecureHTTP }}
            - name: IVALDI_ALLOW_INSECURE_HTTP
              value: "true"
            {{- end }}
            - name: IVALDI_AUTHENTICATION_METHOD
              value: {{ .Values.agent.authentication | quote }}
            - name: IVALDI_ENROLMENT_SECRET
              value: {{ .Values.enrolment.secretName | quote }}
            - name: IVALDI_STATE_SECRET
              value: {{ .Values.state.secretName | quote }}
            - name: IVALDI_FINGERPRINT_SECRET
              value: {{ .Values.fingerprint.secretName | quote }}
            - name: IVALDI_LEASE_NAME
              value: {{ include "ivaldi-agent.fullname" . | quote }}
            - name: IVALDI_MAX_CONCURRENT_APPLIES
              value: {{ .Values.maxConcurrentApplies | quote }}
            {{- with .Values.registry.pullSecret }}
            - name: IVALDI_REGISTRY_PULL_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.registry.plainHTTPHosts }}
            - name: IVALDI_PLAIN_HTTP_REGISTRIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.secrets.credentials }}
            {{- $credentials := list }}
            {{- range $name, $credential := . }}
            {{- $credentials = append $credentials (printf "%s=%s/%s" $name $credential.secretName $credential.key) }}
            {{- end }}
            - name: IVALDI_SECRET_CREDENTIALS
              value: {{ join "," $credentials | quote }}
            {{- end }}
            {{- with .Values.secrets.addresses }}
            - name: IVALDI_SECRET_ADDRESSES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.controlPlane.caConfigMap }}
            - name: IVALDI_CLIENT_CA_FILE
              value: /etc/ivaldi/ca/ca.crt
            {{- end }}
            {{- if eq .Values.agent.authentication "mtls" }}
            - name: IVALDI_CLIENT_CERT_FILE
              value: /var/run/secrets/ivaldi/tls/tls.crt
            - name: IVALDI_CLIENT_KEY_FILE
              value: /var/run/secrets/ivaldi/tls/tls.key
            {{- end }}
            - name: IVALDI_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: IVALDI_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Helm's registry client looks for configuration under HOME.
            - name: HOME
              value: /tmp
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: ivaldi-token
              mountPath: /var/run/secrets/ivaldi
              readOnly: true
            {{- if .Values.secrets.addresses }}
            - name: vault-token
              mountPath: /var/run/secrets/ivaldi-vault
              readOnly: true
            {{- end }}
            {{- if .Values.secrets.infisical.kubernetesAuth }}
            - name: infisical-token
              mountPath: /var/run/secrets/ivaldi-infisical
              readOnly: true
            {{- end }}
            {{- if eq .Values.agent.authentication "mtls" }}
            - name: tls
              mountPath: /var/run/secrets/ivaldi/tls
              readOnly: true
            {{- end }}
            {{- if .Values.controlPlane.caConfigMap }}
            - name: ca
              mountPath: /etc/ivaldi/ca
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        # The Kubernetes API credentials automounting would give, mounted
        # explicitly because automounting is off.
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        # The token the agent presents to the control plane, for the
        # kubernetes method; its audience must match the control plane's
        # runners.kubernetes_audience.
        - name: ivaldi-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: ivaldi
                  expirationSeconds: 3600
        {{- if .Values.secrets.addresses }}
        # The token the agent logs in to Vault with in agent mode. It is made for Vault's
        # audience, so a Vault that receives it cannot use it on the
        # Kubernetes API.
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.secrets.vault.audience | quote }}
                  expirationSeconds: 3600
        {{- end }}
        {{- if .Values.secrets.infisical.kubernetesAuth }}
        # The token the agent logs in to Infisical's Kubernetes auth with in
        # agent mode, made for Infisical's audience for the same reason.
        - name: infisical-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.secrets.infisical.audience | quote }}
                  expirationSeconds: 3600
        {{- end }}
        {{- if eq .Values.agent.authentication "mtls" }}
        - name: tls
          secret:
            secretName: {{ required "agent.tlsSecretName is required for mtls" .Values.agent.tlsSecretName }}
        {{- end }}
        {{- with .Values.controlPlane.caConfigMap }}
        - name: ca
          configMap:
            name: {{ . }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
