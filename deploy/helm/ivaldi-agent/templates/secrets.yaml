{{- if .Values.enrolment.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.enrolment.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ivaldi-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.enrolment.token | quote }}
---
{{- end }}
# The agent writes its credential here. It is created empty; the agent's
# writes are its own and an upgrade leaves them alone.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.state.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ivaldi-agent.labels" . | nindent 4 }}
type: Opaque
---
# The key secret fingerprints are made with. Rollbacks compare against
# fingerprints made with it, so uninstalling the chart keeps it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.fingerprint.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ivaldi-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
