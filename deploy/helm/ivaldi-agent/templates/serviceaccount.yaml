apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ivaldi-agent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ivaldi-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The Pod mounts the tokens it needs explicitly (see deployment.yaml).
automountServiceAccountToken: false
