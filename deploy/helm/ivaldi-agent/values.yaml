# The Ivaldi Kubernetes agent. The web app's cluster onboarding guide writes
# these values for you; values.schema.json lists and checks every one.

controlPlane:
  # -- The control plane's URL, as the cluster reaches it. Required, and
  # https unless allowInsecureHTTP is set.
  url: ""
  # -- Allow an http:// url, which sends the agent's credentials in
  # plaintext. For local development only.
  allowInsecureHTTP: false
  # -- A ConfigMap in the release namespace with a "ca.crt" that verifies
  # the control plane, when it uses a private CA.
  caConfigMap: ""

agent:
  # -- How the agent authenticates to the control plane: kubernetes (a
  # projected service-account token; the control plane must trust this
  # cluster's OIDC issuer), bearer (a token Ivaldi issues), or mtls.
  authentication: kubernetes
  # -- For mtls: a kubernetes.io/tls Secret with the agent's client
  # certificate.
  tlsSecretName: ""

enrolment:
  # -- The one-time enrolment token. Prefer creating the Secret yourself, as
  # the onboarding guide does, so the token is never in a values file; when
  # this is set, the chart creates the Secret.
  token: ""
  # -- The Secret holding the token under the key "token".
  secretName: ivaldi-enrolment

state:
  # -- The Secret the agent keeps its credential in. The chart creates it.
  secretName: ivaldi-state

fingerprint:
  # -- The Secret holding the key the agent fingerprints secret values
  # with. The chart creates it empty and keeps it on uninstall; back it up
  # with the cluster's other Secrets, because rollbacks compare against
  # fingerprints made with it.
  secretName: ivaldi-fingerprint-key

observe:
  # -- Namespaces the agent may read. Empty means every namespace,
  # read-only, through a ClusterRoleBinding.
  namespaces: []

execute:
  # -- Namespaces the agent may deploy to, through a RoleBinding to the
  # built-in edit ClusterRole in each. The agent is never given
  # cluster-wide writes.
  namespaces: []
  # -- Bind admin instead of edit, so charts may create Roles and
  # RoleBindings in those namespaces.
  allowRBAC: false

secrets:
  # -- Namespaces whose Secrets the agent may read, for the kubernetes
  # Secret Store.
  kubernetesNamespaces: []

registry:
  # -- A docker-config Secret in the release namespace with credentials for
  # pulling charts.
  pullSecret: ""

# -- How many Deployments the agent applies at once.
maxConcurrentApplies: 4

image:
  repository: ghcr.io/ivaldibuild/ivaldi-k8s-agent
  # -- Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # -- Annotations for the agent's ServiceAccount, such as an IAM role for
  # a cloud Secret Store.
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

nameOverride: ""
fullnameOverride: ""
