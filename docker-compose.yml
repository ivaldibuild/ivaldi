# Local development and testing.
#
#   make local_stack   Everything in containers: PostgreSQL, Valkey, the
#                      migrations, the control plane and the web app it serves
#                      on http://localhost:8660, and the gateway on
#                      http://localhost:8663
#   make local         Only PostgreSQL and Valkey, for `make local_serve`
#
# Both create config.local.yml from config.local.example.yml when it is
# missing, and generate the secrets in .local/. The control plane reads the
# same config.local.yml either way; in a container, only the database and
# Valkey addresses are overridden. Variables in .env override it too.
services:
  postgres:
    image: postgres:17.5-alpine3.22
    container_name: ivaldi_postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=ivaldi_db_user
      - POSTGRES_PASSWORD=${PG_PASSWORD:-brokandsindri}
      - POSTGRES_DB=ivaldi
      - PGUSER=ivaldi_db_user
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivaldi_db_user"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  redis:
    image: valkey/valkey:8.1-alpine3.22
    container_name: ivaldi_valkey
    ports:
      - "127.0.0.1:6379:6379"
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    volumes:
      - ./volumes/valkey:/data
      - ./conf/valkey.conf:/etc/valkey/valkey.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$(sed -n 's/^requirepass //p' /etc/valkey/valkey.conf)\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  # Applies every capability's migrations with the image's own `migrate`
  # command, the same path a release uses, then exits. Each capability keeps
  # its versions in its own table.
  migrate:
    image: ivaldi-local
    container_name: ivaldi_migrate
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    command: ["migrate", "up"]
    environment:
      IVALDI_DATABASE_URL: postgres://ivaldi_db_user:${PG_PASSWORD:-brokandsindri}@postgres:5432/ivaldi?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  control-plane:
    container_name: ivaldi_control_plane
    # The gateway runs the same image.
    image: ivaldi-local
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    # The working directory mirrors the repository root, so the relative paths
    # in config.local.yml, such as .local/signing.pem, resolve as they do for
    # `make local_serve`.
    working_dir: /ivaldi
    command: ["serve", "--config", "config.local.yml"]
    # Runs as you, so it can read the secrets in .local/, which only you may
    # read. `make local_stack` sets these to your IDs.
    user: "${IVALDI_UID:-1000}:${IVALDI_GID:-1000}"
    ports:
      - "127.0.0.1:8660:8660"
    volumes:
      - ./config.local.yml:/ivaldi/config.local.yml:ro
      - ./.local:/ivaldi/.local:ro
    env_file:
      - path: .env
        required: false
    environment:
      # Only what differs inside the compose network.
      IVALDI_DATABASE_URL: postgres://ivaldi_db_user:${PG_PASSWORD:-brokandsindri}@postgres:5432/ivaldi?sslmode=disable
      IVALDI_REDIS_ADDRESS: redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The integration gateway (`ivaldi gateway`): it receives GitHub webhooks on
  # http://localhost:8663/webhooks/github and calls the control plane as the
  # platform workload config.local.yml lists (ADR 0015). GitHub cannot reach
  # localhost, so expose it with `tailscale funnel --bg 8663` (see
  # docs/self-hosting/version-control.md).
  gateway:
    container_name: ivaldi_gateway
    image: ivaldi-local
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    working_dir: /ivaldi
    command: ["gateway", "--config", "config.local.yml"]
    user: "${IVALDI_UID:-1000}:${IVALDI_GID:-1000}"
    ports:
      - "127.0.0.1:8663:8663"
    volumes:
      - ./config.local.yml:/ivaldi/config.local.yml:ro
      - ./.local:/ivaldi/.local:ro
    env_file:
      - path: .env
        required: false
    environment:
      # Only what differs inside the compose network: the gateway listens on
      # every interface so the published port reaches it.
      IVALDI_GATEWAY_HOST: 0.0.0.0
      IVALDI_GATEWAY_CONTROL_PLANE_URL: http://control-plane:8660
      IVALDI_REDIS_ADDRESS: redis:6379
    depends_on:
      - control-plane
      - redis
    restart: unless-stopped
